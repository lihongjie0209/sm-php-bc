name: Daily Full Test Suite

on:
  # 每天凌晨 2:00 (UTC) 运行
  schedule:
    - cron: '0 2 * * *'
  
  # 允许手动触发
  workflow_dispatch:
  
  # 也在 main 分支推送时运行
  push:
    branches:
      - main
      - master

jobs:
  php-tests:
    name: PHP Tests (PHP ${{ matrix.php-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php-version: ['8.1', '8.2', '8.3']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gmp, bcmath, mbstring
          coverage: xdebug
          tools: composer:v2
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Run full test suite
        run: vendor/bin/phpunit --testdox --stop-on-failure
      
      - name: Run code coverage
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.3'
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-php${{ matrix.php-version }}
          path: |
            .phpunit.result.cache
            coverage.xml
          retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, bcmath, mbstring
          tools: composer:v2
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Check code style (if configured)
        run: |
          if [ -f "vendor/bin/phpcs" ]; then
            vendor/bin/phpcs --standard=PSR12 src/
          else
            echo "PHP_CodeSniffer not installed, skipping..."
          fi
        continue-on-error: true
      
      - name: Run static analysis (if configured)
        run: |
          if [ -f "vendor/bin/phpstan" ]; then
            vendor/bin/phpstan analyse src/ --level=max
          else
            echo "PHPStan not installed, skipping..."
          fi
        continue-on-error: true

  cross-platform-compatibility:
    name: Cross-Platform Test
    runs-on: ubuntu-latest
    needs: php-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, bcmath, mbstring
          tools: composer:v2
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Run all examples
        run: |
          php examples/sm2_demo.php
          php examples/sm3_demo.php
          php examples/sm4_demo.php
          php examples/key_exchange_demo.php
          php examples/advanced_demo.php
        timeout-minutes: 10

  notify-results:
    name: Notify Test Results
    runs-on: ubuntu-latest
    needs: [php-tests, code-quality, cross-platform-compatibility]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "PHP Tests: ${{ needs.php-tests.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Cross-Platform: ${{ needs.cross-platform-compatibility.result }}"
          
          if [ "${{ needs.php-tests.result }}" != "success" ] || \
             [ "${{ needs.cross-platform-compatibility.result }}" != "success" ]; then
            echo "❌ Some tests failed!"
            exit 1
          else
            echo "✅ All tests passed!"
          fi
